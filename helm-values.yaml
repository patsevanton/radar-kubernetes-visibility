ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: radar.81.26.185.134.sslip.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: radar-tls
      hosts:
        - radar.81.26.185.134.sslip.io

rbac:
  podLogs: true    # просмотр логов подов (включён по умолчанию)
  podExec: false   # терминал в подах — включайте осознанно
  secrets: false   # чтение Secrets — выключено по умолчанию
  helm: false      # Helm write-операции — выключено по умолчанию

timeline:
  storage: memory

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
